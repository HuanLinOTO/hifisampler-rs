[workspace]
members = [
  "crates/hifisampler-server",
  "crates/hifisampler-bridge",
  "crates/hifisampler-core",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/openhachimi/hifisampler"
version = "0.1.6"

[workspace.dependencies]
# Async runtime
tokio = {version = "1", features = ["full"]}
# HTTP server
axum = {version = "0.8", features = ["macros"]}
tower = "0.5"
tower-http = {version = "0.6", features = ["cors", "fs"]}
# Serialization
serde = {version = "1", features = ["derive"]}
serde_json = "1"
serde_yaml = "0.9"
# Burn (native Rust inference) — base only; cuda/wgpu features are
# controlled by hifisampler-core's own feature flags.
burn = { version = "0.21", default-features = false, features = ["std", "fusion", "autotune"] }
burn-store = "0.21"
# Audio processing
hound = "3.5"
rubato = "0.16"
rustfft = "6"
# Logging
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["env-filter"]}
# Error handling
anyhow = "1"
thiserror = "2"
# Misc
base64 = "0.22"
clap = {version = "4", features = ["derive"]}
num-complex = "0.4"
parking_lot = "0.12"
regex = "1"
reqwest = {version = "0.12", features = ["blocking"]}

# ── Release profile: optimize bridge for minimal size ──
[profile.release.package.hifisampler-bridge]
codegen-units = 1
opt-level = "z"
strip = true

[profile.release]
lto = "thin"
opt-level = 3

# ── Patch: widen gpu-allocator's windows crate range so it unifies with
# wgpu-hal 29 (which uses windows 0.62.2). Upstream gpu-allocator 0.28 caps
# at <=0.62 which excludes 0.62.2, causing D3D12 type-mismatch errors.
[patch.crates-io]
gpu-allocator = { path = "patches/gpu-allocator-0.28.0" }
