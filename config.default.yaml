# HiFiSampler Rust Configuration
# ============================

# Audio settings
sample_rate: 44100
win_size: 2048
hop_size: 512
hop_size_interp: 128
num_mels: 128
n_fft: 2048
fmin: 40.0
fmax: 16000.0
pad_frames: 6

# Vocoder model (Burn native inference — pure Rust, no ONNX Runtime needed)
vocoder:
  model: models/vocoder/vocoder_fused.bpk
  model_type: burn

# Harmonic-Noise Separation model (Burn native inference — pure Rust, no ONNX Runtime needed)
hnsep:
  model: models/hnsep/hnsep_fused.bpk

# Processing settings
processing:
  wave_norm: false
  wave_norm_clip_silence: true
  silence_threshold: -52.0
  wave_norm_max_boost_db: 18.0
  wave_norm_low_level_protect_db: -40.0
  wave_norm_tail_peak_limit_dbfs: -6.0
  wave_norm_tail_mode: preserve_relative
  loop_mode: false
  peak_limit: 1.0

# Performance settings
performance:
  num_threads: 2
  # Device: auto, cpu, vulkan (Burn wgpu backend), or cuda (Burn CUDA backend)
  device: auto
  # GPU adapter index (0-based)
  device_id: 0

# Server settings
server:
  host: "127.0.0.1"
  port: 8572
