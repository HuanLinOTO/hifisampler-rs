[package]
edition.workspace = true
name = "hifisampler-core"
version.workspace = true

[features]
default = ["wgpu"]
# NVIDIA CUDA backend (via cudarc). Mutually exclusive with wgpu in practice —
# pick one at build time. CI builds two binaries: one with cuda, one with wgpu.
cuda = ["burn/cuda"]
# wgpu backend (WGSL) — works everywhere (AMD, Intel, NVIDIA, Apple Metal).
# Default backend uses WGSL shaders which don't require Vulkan SDK.
wgpu = ["burn/wgpu"]
# Vulkan backend via SPIR-V shaders — faster than WGSL on Windows/Linux but
# requires Vulkan SDK at build time. NOT supported on macOS (use plain wgpu).
# Enable with: --features hifisampler-core/vulkan
vulkan = ["burn/vulkan"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
burn.workspace = true
burn-store.workspace = true
hound.workspace = true
ndarray = "0.17"
num-complex.workspace = true
parking_lot.workspace = true
regex.workspace = true
rubato.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
