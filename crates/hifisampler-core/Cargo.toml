[package]
edition.workspace = true
name = "hifisampler-core"
version.workspace = true

[features]
default = ["wgpu"]
# NVIDIA CUDA backend (via cudarc). Mutually exclusive with wgpu in practice —
# pick one at build time. CI builds two binaries: one with cuda, one with wgpu.
cuda = ["burn/cuda"]
# wgpu/Vulkan backend — works on AMD, Intel, and NVIDIA (via Vulkan).
wgpu = ["burn/wgpu", "burn/vulkan"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
burn.workspace = true
burn-store.workspace = true
hound.workspace = true
ndarray = "0.17"
num-complex.workspace = true
parking_lot.workspace = true
regex.workspace = true
rubato.workspace = true
rustfft.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tracing-subscriber.workspace = true
tracing.workspace = true
