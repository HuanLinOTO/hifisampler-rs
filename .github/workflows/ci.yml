name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always
  # Burn model files on HuggingFace (individual .pt files, not 7z archive)
  HF_MODELS_BASE: "https://huggingface.co/SVCFusion/things/resolve/main/hifisampler"

jobs:
  # ────────────────────────── Build + Package (per-variant) ──────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Windows CPU (wgpu/WGSL — no Vulkan SDK needed) ──
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            variant: cpu
            artifact: hifisampler-windows-x64-cpu
            cargo_features: ""
          # ── Windows CUDA ──
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
            variant: cuda
            artifact: hifisampler-windows-x64-cuda
            cargo_features: "--features hifisampler-core/cuda --no-default-features"
          # ── Linux CPU (wgpu/WGSL) ──
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            variant: cpu
            artifact: hifisampler-linux-x64-cpu
            cargo_features: ""
          # ── Linux CUDA ──
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
            variant: cuda
            artifact: hifisampler-linux-x64-cuda
            cargo_features: "--features hifisampler-core/cuda --no-default-features"
          # ── macOS ARM64 (wgpu/WGSL) ──
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
            variant: cpu
            artifact: hifisampler-macos-arm64
            cargo_features: ""

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.artifact }})

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-${{ matrix.variant }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      # ── Build ──
      # cudarc uses dynamic loading — no CUDA toolkit needed at build time.
      # The resulting binary loads CUDA runtime from the user's NVIDIA driver.
      - name: Build (release)
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }} ${{ matrix.cargo_features }}

      # ── Download Burn model files from HuggingFace ──
      - name: Download models
        shell: bash
        run: |
          mkdir -p models/vocoder models/hnsep
          echo "Downloading vocoder_fused.pt..."
          curl -fSL --retry 3 "$HF_MODELS_BASE/vocoder_fused.pt" -o models/vocoder/vocoder_fused.pt
          echo "Downloading hnsep_fused.pt..."
          curl -fSL --retry 3 "$HF_MODELS_BASE/hnsep_fused.pt" -o models/hnsep/hnsep_fused.pt
          ls -lhR models/

      # ── Run unit tests (CPU variants only — no GPU in CI) ──
      - name: Run unit tests
        if: matrix.variant == 'cpu'
        shell: bash
        run: cargo test --release --target ${{ matrix.target }} ${{ matrix.cargo_features }}

      # ── Package (Windows) ──
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $out

          # Binaries
          Copy-Item "target/${{ matrix.target }}/release/hifisampler-server.exe" "$out/"
          Copy-Item "target/${{ matrix.target }}/release/hifisampler.exe"        "$out/"

          # Config & docs
          Copy-Item "config.default.yaml" "$out/"
          Copy-Item "README.md"           "$out/"
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "$out/" }

          # WebUI & models
          if (Test-Path "webui") { Copy-Item -Recurse "webui" "$out/webui" }
          if (Test-Path "models") { Copy-Item -Recurse "models" "$out/models" }

          # CUDA runtime DLLs (CUDA variant only)
          # cudarc uses dynamic loading — needs cublas + nvrtc at runtime.
          # nvcuda.dll comes from the NVIDIA driver, not packaged here.
          if ("${{ matrix.variant }}" -eq "cuda") {
            $cudaPaths = @(
              "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v*\bin",
              "C:\Program Files\NVIDIA Corporation\CUDA\v*\bin"
            )
            $cudaBin = $null
            foreach ($p in $cudaPaths) {
              $found = Get-Item $p -ErrorAction SilentlyContinue | Sort-Object -Descending | Select-Object -First 1
              if ($found) { $cudaBin = $found.FullName; break }
            }
            if (-not $cudaBin) {
              Write-Host "::warning::CUDA Toolkit not found on runner — CUDA DLLs will not be packaged"
            } else {
              Write-Host "Found CUDA Toolkit at: $cudaBin"
              # Required by cudarc: cublas (matmul), nvrtc (kernel JIT compilation)
              $requiredDlls = @(
                "cublas64_*.dll",
                "cublasLt64_*.dll",
                "nvrtc64_*.dll"
              )
              foreach ($pattern in $requiredDlls) {
                $dlls = Get-ChildItem "$cudaBin\$pattern" -ErrorAction SilentlyContinue
                foreach ($dll in $dlls) {
                  Copy-Item $dll.FullName "$out/"
                  Write-Host "  Packaged: $($dll.Name)"
                }
              }
            }
          }

      # ── Build Inno Setup installer (Windows only) ──
      - name: Build installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sourceDir = (Resolve-Path "dist/${{ matrix.artifact }}").Path
          $rawRef = "${{ github.ref_name }}"
          $version = if ($rawRef -match '^\d+(\.\d+){1,3}([\-+][0-9A-Za-z\.-]+)?$') { $rawRef } else { "0.1.0" }
          $version = $version -replace '[\\/:*?"<>|]', '-'
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DSourceDir="$sourceDir" `
            /DVariant="${{ matrix.variant }}" `
            /DMyAppVersion="$version" `
            installer\setup.iss

      # ── Package (Linux/macOS) ──
      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          out="dist/${{ matrix.artifact }}"
          mkdir -p "$out"

          # Binaries
          cp "target/${{ matrix.target }}/release/hifisampler-server" "$out/"
          cp "target/${{ matrix.target }}/release/hifisampler"        "$out/"
          chmod +x "$out/hifisampler-server" "$out/hifisampler"

          # Config & docs
          cp config.default.yaml "$out/"
          cp README.md           "$out/"
          [ -f LICENSE ] && cp LICENSE "$out/"

          # WebUI & models
          [ -d webui ] && cp -r webui "$out/webui"
          [ -d models ] && cp -r models "$out/models"

          # CUDA runtime shared libs (CUDA variant only)
          # cudarc uses dynamic loading — needs cublas + nvrtc at runtime.
          # libcuda.so comes from the NVIDIA driver, not packaged here.
          if [ "${{ matrix.variant }}" = "cuda" ]; then
            cuda_lib_paths=""
            for dir in /usr/local/cuda*/lib64 /usr/lib/cuda/lib64; do
              if [ -d "$dir" ]; then
                cuda_lib_paths="$dir"
                break
              fi
            done
            if [ -z "$cuda_lib_paths" ]; then
              echo "::warning::CUDA lib dir not found — CUDA .so files will not be packaged"
            else
              echo "Found CUDA libs at: $cuda_lib_paths"
              for pattern in "libcublas.so*" "libcublasLt.so*" "libnvrtc.so*"; do
                for f in $cuda_lib_paths/$pattern; do
                  [ -f "$f" ] && cp -P "$f" "$out/" && echo "  Packaged: $(basename $f)"
                done
              done
            fi
          fi

      # Upload the assembled directory
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/

      # Upload installer (Windows only)
      - name: Upload installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-installer
          path: installer/output/*.exe

  # ────────────────────────── Release ──────────────────────────
  release:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release archives
        shell: bash
        run: |
          mkdir -p release_assets
          cd artifacts
          for dir in */; do
            name="${dir%/}"

            # Installer exes — copy directly
            if [[ "$name" == *-installer ]]; then
              cp "$name"/*.exe ../release_assets/ 2>/dev/null || true
              continue
            fi

            # Portable packages — create archive
            if [[ "$name" == *windows* ]]; then
              (cd "$name" && zip -r "../../release_assets/${name}.zip" .)
            else
              tar -C "$name" -czf "../release_assets/${name}.tar.gz" .
            fi
          done
          echo "=== Release assets ==="
          ls -lh ../release_assets/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
